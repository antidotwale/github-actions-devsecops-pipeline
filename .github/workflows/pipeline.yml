name: pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.76.1"
  TRIVY_SHA256: "c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0"
  SEMGREP_VERSION: "1.186.0"
  CHECKOV_VERSION: "3.4.5"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run unit tests
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir -r requirements.txt -r requirements-dev.txt
          "$RUNNER_TEMP/venv/bin/pytest" -q

  secrets-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks (checksum verified)
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Scan full git history
        run: ./gitleaks git . --redact --no-banner --verbose

  sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --no-cache-dir "semgrep==${SEMGREP_VERSION}"
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan --config p/python --config p/flask --metrics=off --error .

  dockerfile-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Checkov on the Dockerfile
        run: |
          python3 -m venv "$RUNNER_TEMP/checkov"
          "$RUNNER_TEMP/checkov/bin/pip" install --no-cache-dir "checkov==${CHECKOV_VERSION}"
          "$RUNNER_TEMP/checkov/bin/checkov" -f Dockerfile --framework dockerfile --compact

  vuln-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Trivy (checksum verified)
        run: |
          curl -sSfL -o trivy.tar.gz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
      - name: Scan source, dependencies and config
        run: |
          ./trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress --skip-version-check --timeout 15m .
      - name: Build image
        run: docker build -t devsecops-demo:ci .
      - name: Smoke test the container
        run: |
          docker run -d --rm --name smoke -p 8000:8000 devsecops-demo:ci
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/health
          test "$(docker exec smoke id -u)" = "10001"
          docker stop smoke
      - name: Write full image report and SBOM
        run: |
          mkdir -p reports
          ./trivy image --no-progress --skip-version-check --timeout 15m --format table --output reports/trivy-image-all.txt devsecops-demo:ci
          ./trivy image --no-progress --skip-version-check --timeout 15m --format cyclonedx --output reports/sbom.cdx.json devsecops-demo:ci
      - name: Gate 1, fail on any CRITICAL
        run: ./trivy image --no-progress --skip-version-check --timeout 15m --severity CRITICAL --exit-code 1 devsecops-demo:ci
      - name: Gate 2, fail on HIGH that has a fix
        run: ./trivy image --no-progress --skip-version-check --timeout 15m --severity HIGH --ignore-unfixed --exit-code 1 devsecops-demo:ci
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scan-reports
          path: reports/
          retention-days: 14
